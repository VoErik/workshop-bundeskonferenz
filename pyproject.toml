[project]
name = "workshop-bundeskonferenz"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "circuitsvis>=1.43.3",
    "ipywidgets",
    "matplotlib",
    "peft>=0.21.2",
    "rich",
    "transformers>=5.22.2",
]

[dependency-groups]
dev = ["ipykernel>=7.3.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["workshop"]